[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-terminal-agent"
version = "2.0.0"
description = "A multi-model AI terminal assistant with rich input panel and local agent tools"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Devesh Tiwari"}
]

dependencies = [
    # TUI
    "textual>=0.70.0",

    # LangChain core
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-openrouter>=0.1.0",

    # Environment
    "python-dotenv>=1.0.0",

    # Agent tools — web fetch
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
# Install with:  pip install -e ".[voice]"
voice = [
    "openai-whisper",
    "pyttsx3",
]

[project.scripts]
# Launch with: ai-agent
ai-agent = "ai_terminal.__main__:main"