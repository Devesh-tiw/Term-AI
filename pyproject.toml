[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ai_terminal"]

[tool.setuptools.package-data]
ai_terminal = ["assets/**/*"]

[project]
name = "multi-model-term-ai"
version = "2.1.0"
description = "A multi-model AI terminal assistant with voice, rich input panel, and local agent tools"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Devesh Tiwari"}
]

dependencies = [
    # TUI
    "textual>=0.70.0",

    # LangChain core
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-openrouter>=0.1.0",

    # Env + HTTP
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
# Voice engine — install with:  pip install -e ".[voice]"
voice = [
    "faster-whisper>=1.0.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "edge-tts>=6.1.0",
]

[project.scripts]
ai-agent = "ai_terminal.__main__:main"
