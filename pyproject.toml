[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-terminal-agent"
version = "1.0.0"
description = "A multi-model AI assistant for the terminal"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Devesh Tiwari"}
]
dependencies = [
    "textual>=0.70.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-openrouter>=0.1.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
# This means when the user types "ai-agent" in their terminal,
# Python will run the main() function inside ai_terminal/__main__.py
ai-agent = "ai_terminal.__main__:main"

